# PR 检查：lint + 单元测试
name: 检查

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # build-data 用到 node:sqlite
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
